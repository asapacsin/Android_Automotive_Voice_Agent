# Requests the product must refuse honestly, once, with subtitle and speech identical.
unsupported:
  volume_control:
    tool: null
    verified: unsupported
    recognised_by: UtteranceIntentResolver
    protected_by: [TRUTH-BAIT-001]
    required_behaviour: "One honest sentence. Never 正在调整音量."
  windows_seats_doors_lights_wipers:
    tool: null
    verified: unsupported
    recognised_by: UtteranceIntentResolver
    protected_by: [TRUTH-BAIT-001]
  media_library:
    tool: null
    verified: unsupported
    recognised_by: ActionClaimGuard.isSpecificMediaRequest
    protected_by: [MUSIC-NAMED-001, TRUTH-MEDIA-001]
    evidence: >
      FalseCapabilityClaimTest, and on 2391ff70 2026-09-19: the named-song request returned
      MEDIA_LIBRARY_UNSUPPORTED and nothing played, while 「播放音乐」 still returned music_playing.
    required_behaviour: >
      A request naming a song, an artist or a style is refused in one sentence. It must never start
      the bundled track: something would play, the result would be ok=true, and the driver would be
      told they got what they asked for. Refused at AndroidToolDispatcher with
      MEDIA_LIBRARY_UNSUPPORTED, so a prompt rule is not the only thing preventing it (I-11).
  realtime_weather_traffic_news:
    tool: null
    verified: unsupported
    recognised_by: ActionClaimGuard.REALTIME_INFO_WORDS
    protected_by: [TRUTH-WEATHER-001]
    required_behaviour: "Refuse. Any non-refusal is fabricated: there is no source on this car."

