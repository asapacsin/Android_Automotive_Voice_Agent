# Facts that cannot be established without a person or a place.
human_verification_pending:
  - capability: open_mic_thresholds
    reason: "H1 - needs real cabin acoustics: road noise, passengers, speed"
  - capability: navigation.guidance_voice
    reason: "H1 - loudness and speech quality are a human judgement"
  - capability: phone.place_call
    reason: "H2 - needs a SIM and a number its owner agrees this app may ring; no call has been placed"
