speech:
  tts:
    tool: null
    verified: device
    protected_by: [TRUTH-CLAIM-001]
    regression_test: listeningLifecycleIsTheSwitchForCloudAudio
    notes: "The model's own audio; there is no separate TTS engine."
  silent_mode:
    tool: set_speech_output
    verified: device
    protected_by: [BARGEIN-001]
    evidence: "闭嘴 -> SILENT_WAIT in 2 ms, reply cut off, listening continues"
  sleep:
    tool: end_conversation
    verified: device
    protected_by: [SLEEP-001]
    evidence: "休眠 -> SLEEP; speech in SLEEP ignored; tap or wake word -> ACTIVE"
  interrupt_tts_by_voice:
    tool: null
    verified: unsupported
    notes: >
      The microphone is gated while the assistant speaks, so the driver cannot interrupt by
      talking. The wake word is the interrupt. Deliberate trade-off, docs/ARCHITECTURE.md.
  wake_word:
    tool: null
    verified: human
    protected_by: [WAKE-REAL-001]
    regression_test: wakeWordIsBoundAtAppStart
    evidence: "2026-09-19: the product owner said 你好小诺 to 2391ff70 and the session opened"
    notes: >
      Reached `human` the hard way. Two earlier claims here were false and are kept in mind rather
      than deleted: "Engine initialises" was recorded while the engine ended every session with
      code 200061, and `device` was recorded from synthesized audio. A real voice has now done it.
  capability_help:
    tool: null
    verified: device
    recognised_by: UtteranceIntentResolver
    protected_by: [HELP-UNIT-001, HELP-001]
    regression_test: capabilityHelpGrammarAndHoldStayWired
    required_behaviour: >
      When the driver asks what the assistant can do, reply with [ProductCapabilities.spokenHelpSummary]
      (or equivalent nouns from supported groups). Never 没听清 / 不理解 / invented 音量·天气.
  post_speech_echo_protection:
    tool: null
    verified: device
    protected_by: [ECHO-001]
    regression_test: postSpeechEchoHoldStaysWired
    required_behaviour: >
      Residual cabin echo of the assistant's own reply must not become a phantom 「没听清」 turn.
    evidence: "ECHO-001 PASS 2026-09-21"
  action_claim_truthfulness:
    tool: null
    verified: unit
    protected_by: [TRUTH-CLAIM-001, TRUTH-MISHEARD-001]
    regression_test: strayNoiseIsGatedBeforeTheModelAndSilencedAfterIt
    required_behaviour: >
      Only executor results may be spoken as done; false claims and fabricated realtime info are dropped.
    evidence: "ActionClaimGuardTest, DriverTurnTest, FalseCapabilityClaimTest"

phone:
  place_call:
    tool: place_call
    verified: unit
    required_scope: END_TO_END
    protected_by: [CALL-CONFIRM-001, CALL-CLASSIFY-001]
    evidence: "PhoneCallToolTest: confirm-before-dial, ambiguity, unknown name, and no-SIM refusal"
    human_gap: true
    notes: >
      Two turns on purpose: the first resolves the contact and asks, the second dials only with
      confirmed=true. Every other tool here can be undone by saying the opposite; a wrong call has
      already rung someone. The confirmation exists because mis-transcription is measured, not
      hypothetical (P23).
  call_without_sim:
    tool: place_call
    verified: device
    protected_by: [CALL-NOSIM-001]
    evidence: "2026-09-20 on 2391ff70 (gsm.sim.state=ABSENT): NO_TELEPHONY, no dialler started"
    notes: "A car that cannot call says so. Starting the dialler and reporting success would be I-1's exact failure."

