# Canonical, machine-readable capability truth.
#
# docs/CAPABILITIES.md is the prose for humans; this file is what tests and scripts read. They are
# kept in step by behavior-test/CapabilityContractTest, which fails when a tool is declared to the
# model but missing here, or listed here but not routed to an executor.
#
# verified: how far this capability has actually been proven. Do not upgrade a level without the
# evidence that level requires (ACCEPTANCE_TESTS.md defines them):
#   implemented   - code exists and compiles
#   unit          - deterministic tests cover the behaviour
#   device        - observed working on the phone, with a log line or screenshot as evidence
#   human         - a person has confirmed it with their own voice/ears/eyes
#   unsupported   - deliberately not provided; the app must say so and never pretend
#
# tool: the function name declared in BaiduFlexProtocol.sessionUpdate, or null when there is none.
#
# required_scope: the minimum test scope (COMPONENT < INTERMEDIATE_FLOW < END_TO_END) whose
# verdict may cover this requirement. Owned HERE, not by the test entry: a test author scopes
# their own test, but only this registry says what bar satisfies the requirement, so an E2E
# requirement can never be laundered through an intermediate test. Absent means COMPONENT.
# scripts/test_matrix.py --coverage reports per-requirement cover; UNCOVERED flow/E2E
# requirements hold the human gate shut unless a human validation is already queued.

meta:
  updated: 2026-09-22
  commit_at_update: 2cdc002
  device: "Xiaomi 24069RA21C (2391ff70), Android SDK 36"
  completion_invariant: >
    NEW_FEATURE_WORKS AND AFFECTED_OLD_PROTECTED_CAPABILITIES_STILL_WORK AND NO_UNEXPLAINED_REGRESSION.
    A change may complete only when every supported capability in this registry still has PASS
    regression protection (protected_by, covers, or regression_test below).

