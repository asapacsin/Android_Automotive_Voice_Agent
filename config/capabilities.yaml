    verified: device
    protected_by: [NAV-UI-001, NAV-UI-008]
    evidence: "nav_navigation_started routeId=12, spoken once after proof"
    notes: >
      Selecting a route calls startNavi. From 2026-09-20 the host then applies AmapDrivingPresentation
      (lock-car, traffic line, native HUD). Visual driving HUD is human-verified (NAV-UI-*).
  navigate_to_saved_place:
    tool: navigate_to
    verified: device
    protected_by: [NAV-CORRECT-001]
    evidence: "2026-09-19: 回家 -> nav_saved_place slot=HOME set=true, count=1; 去公司 -> slot=WORK"
    notes: >
      「回家」「返屋企」「去公司」 resolve from the driver's saved places, never from a POI
