climate:
  power:
    tool: control_climate
    verified: device
    protected_by: [CLIMATE-OFF-001]
    backend: SimulatedVehicleControl
    notes: "Simulated. Real vehicle = one new VehicleControlPort in VehicleControlProvider."
  set_temperature:
    tool: control_climate
    verified: device
    protected_by: [CLIMATE-SET-001]
    backend: SimulatedVehicleControl
  set_fan:
    tool: control_climate
    verified: device
    protected_by: [CLIMATE-FAN-001]
    backend: SimulatedVehicleControl
  relative_adjustment_from_context:
    tool: control_climate
    verified: device
    protected_by: [CLIMATE-IMPLICIT-001]
    evidence: "ContextResolverTest, 23 cases (SPEC-006 CVC-04..46)"
    notes: >
      「再凉一点」「有点热」「刚才那个调回来一点」. The model has no cross-turn memory here
      (ConversationResetPolicy), so DriverContext holds the record and the bounded implicit-intent
      table is stated in the control_climate declaration the model reads. Raised to device
      2026-09-19 on live-model evidence, not simulation: 26->24 C for the implicit step and
      24->23 C for the relative one, with the spoken line following the result. See
      ACCEPTANCE_TESTS.md. Still NOT proven with a human voice in a cabin.
  ambiguous_relative_request:
    tool: null
    verified: device
    protected_by: [CLIMATE-IMPLICIT-001]
    evidence: >
      ContextResolverTest CVC-11/12/13, and on 2391ff70 2026-09-19: temperature set to 24 and fan to
      3, then the neutral request was refused with AMBIGUOUS_REFERENT and get_state still read
      temperature_c:24. The unchanged state is the evidence, not the error code.
    required_behaviour: >
      When two dimensions were recently adjusted, or none was, 「再低一点」 must be asked about in one
      sentence and no tool called. Guessing correctly is still wrong.

