  save_place:
    tool: save_place
    verified: device
    protected_by: [NAV-CORRECT-001]
    evidence: "2026-09-19: save_place{home,珠海站} -> ok=true place=珠海站, saved_place_set slot=HOME"
    notes: >
      An address that cannot be resolved is not saved. Storing the raw string would move the
      failure to the moment the driver says 「回家」 while driving.
  stop_navigation:
    tool: exit_navigation_mode
    verified: device
    protected_by: [NAV-CANCEL-001]
    evidence: "结束导航 -> nav_stopped reached=true; 算了 cancels the picker"
  guidance_voice:
    tool: null
    verified: device
    required_scope: INTERMEDIATE_FLOW
    protected_by: [NAV-MID-ROUTE-001]
    regression_test: navigationGuidanceIsSpokenAndGatesTheMicrophone
    evidence: "21 nav_guidance_play_start/end pairs on an emulator drive; mic gated while speaking"
    notes: "Amap SDK offline voice. Loudness and quality are a human judgement."
  arrival_lifecycle:
