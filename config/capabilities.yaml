    verified: device
    protected_by: [NAV-PICK-001]
    evidence: "第二个 -> choose_navigation_option index -> route list"
  select_candidate_by_name:
    tool: choose_navigation_option
    verified: device
    protected_by: [NAV-PICK-001]
    evidence: "选择麦当劳创新方商场 -> routes; a name nobody offered returns NO_MATCH"
  select_route:
    tool: choose_navigation_option
    verified: device
    protected_by: [NAV-PICK-001]
