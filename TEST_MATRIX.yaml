  - id: WAKE-REAL-001
    capability: wake_word
    name: Moving-cabin wake-word recognition
    purpose: "Whether a real voice wakes the assistant in a real cabin, which is the only claim that matters to a driver"
    type: device
    scope: COMPONENT
    owner: HUMAN_PHYSICAL
    status: HUMAN_REQUIRED
    automation_blocker: physical_world
    release_blocking: true
    human_reason: "Cabin acoustics - distance, road noise, speaker position - cannot be reproduced by injected audio or by a phone on a desk"
    prerequisites: ["a vehicle", "the app installed on the head unit or phone", "normal driving conditions"]
