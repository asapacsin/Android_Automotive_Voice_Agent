# The canonical verification registry. Machine-readable truth about what has been tested.
#
# Why this exists: before it, "what is verified" had to be reconstructed from ACCEPTANCE_TESTS.md,
# OPEN_PROBLEMS.md, commit messages and device logs, and the only mechanism for a test a human had
# to run was to STOP and ask. That made every human-dependent case a separate interruption.
#
# Here, a test a person must run is a queued item with an owner, not a wall. Autonomous execution
# continues past it. Humans are batched at a phase boundary (harness/PHASES.md).
#
# Generated views - never edit these by hand, they are rebuilt from this file:
#   TEST_STATUS.md       python scripts/test_matrix.py --status
#   HUMAN_VALIDATION.md  python scripts/test_matrix.py --packet
#
# owner: who can execute it at all.
#   AUTONOMOUS        an agent can run it unaided
#   HUMAN_PHYSICAL    a person must perform or perceive something in the physical world
#   HUMAN_ACCOUNT     needs a personal account, SIM, phone number or real service
#   HUMAN_CREDENTIAL  needs private material an agent must never invent (keystore, prod secret)
#   HUMAN_DECISION    the agent can quantify the alternatives; a person must choose
#   EXTERNAL_RESOURCE neither party can supply it from here right now
#
# automation_blocker: required on every HUMAN_REQUIRED row. Legal values:
#   subjective_perception | physical_world | credential_permission |
#   hardware_interface | safety
# Illegal (stay AUTONOMOUS): tapping, ADB, emulator, logs, screenshots/video,
# inconvenience, multi-step.
#
# status: what is currently true. Deliberately NOT one generic BLOCKED - the four reasons a test
# is not passing are different facts and are acted on differently.
#   NOT_RUN | RUNNING | PASS | FAIL | BLOCKED_AUTONOMOUS | HUMAN_REQUIRED
#   BLOCKED_EXTERNAL | NOT_APPLICABLE | HUMAN_PASS | HUMAN_FAIL

