[versions]
kotlin = "2.0.21"
agp = "8.7.3"
junit-jupiter = "5.11.3"
okhttp = "4.12.0"
coroutines = "1.8.1"
android-compile-sdk = "34"
android-min-sdk = "28"
android-target-sdk = "34"
# E1: com.amap.api:navi-3dmap:11.2.100 is unpublished. Nearest resolvable 11.2.100
# is the official combined artifact on Maven Central (navi + 3dmap + location + search).
amap-navi = "11.2.100_3dmap11.2.100_loc11.2.100_sea9.8.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
json = { module = "org.json:json", version = "20240303" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
amap-navi-sdk = { module = "com.amap.api:navi-3dmap-location-search", version.ref = "amap-navi" }
