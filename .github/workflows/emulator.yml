# Record the real drive: simulated user plus the 小诺 map, on a GitHub-hosted emulator.
# ubuntu-latest has working KVM. The app is built only when the Actions secrets are set.
# Required secrets: AMAP_API_KEY, NOVA_VENDOR_ZIP_URL, NOVA_DEBUG_KEYSTORE_B64.
# The debug APK is checked against the Amap key's 调试版安全码 SHA1.
# Results come back as annotations (stage reached, Amap error token, route error code), because
# job logs are not readable from the agent sessions. The video is pushed to branch ci/drive-video.
# From cursor/github-emulator-9a6b (Cursor, 2026-10-15), moved onto claude/10-15.
# The job must not print coordinates, addresses, or transcripts.

name: Drive video

on:
  workflow_dispatch:
  push:
    branches:
      - claude/10-15
      - claude/10-19

permissions:
  contents: write

jobs:
  drive:
    # A push runs it only when the commit message asks: [drive].
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[drive]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Require the app secrets
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
        run: |
          missing=0
          for name in AMAP_API_KEY NOVA_VENDOR_ZIP_URL NOVA_DEBUG_KEYSTORE_B64; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "missing $name"
              missing=1
            fi
          done
          test "$missing" = 0

      - name: Build the debug APK
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openjdk-17-jdk-headless unzip
          sudo mkdir -p /opt/android-sdk
          sudo chown -R "$USER" /opt/android-sdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/opt/android-sdk
          # Run 38719315653 signed the APK with c5330c7c..., not the keystore installed in
          # ~/.android: AGP looks in ANDROID_USER_HOME / ANDROID_PREFS_ROOT / ANDROID_SDK_HOME first.
          echo "::notice title=android location env::$(env | grep -E '^ANDROID_(USER_HOME|PREFS_ROOT|SDK_HOME|EMULATOR_HOME|AVD_HOME)=' | tr '\n' ' ')"
          unset ANDROID_PREFS_ROOT ANDROID_SDK_HOME
          export ANDROID_USER_HOME="$HOME/.android"
          bash scripts/cloud_setup.sh
          sha1=$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | openssl dgst -sha1 | awk '{print $2}')
          md5=$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | openssl dgst -md5 | awk '{print $2}')
          echo "debug cert sha1=$sha1"
          echo "debug cert md5=$md5"
          if [ "$sha1" != "322fe8e733d503aafa6f0037df665452cbd4daeb" ]; then
            echo "The debug keystore secret is not the certificate registered on the Amap Android key."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug
          apk="$HOME/nova-drive-build/app/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          # What Amap will see: the certificate the APK is really signed with, and the shape of the
          # key the manifest got (length and character class only - never the key).
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apk_sha1="$("$signer" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-1 digest: //p' | head -1)"
          pkg="$("$(dirname "$signer")/aapt2" dump packagename "$apk" 2>/dev/null || echo unknown)"
          key="$(sed -n 's/^AMAP_API_KEY=//p' local.properties | tr -d '[:space:]')"
          shape="length=${#key}"
          if printf '%s' "$key" | grep -Eq '^[0-9a-f]+$'; then shape="$shape lowercase-hex"; else shape="$shape not-lowercase-hex"; fi
          echo "::notice title=amap binding the app presents::package=${pkg} apk_sha1=${apk_sha1} key ${shape}"
          stores="$(find / -name debug.keystore -not -path '/proc/*' 2>/dev/null | while read -r f; do printf '%s=%s ' "$f" "$(keytool -exportcert -alias androiddebugkey -keystore "$f" -storepass android 2>/dev/null | openssl dgst -sha1 | awk '{print substr($2,1,8)}')"; done)"
          echo "::notice title=debug keystores on the runner::${stores}"
          if [ "$apk_sha1" != "$sha1" ]; then
            echo "::error title=apk not signed with the Amap-registered certificate::apk_sha1=${apk_sha1} expected=${sha1}"
            exit 1
          fi

      - name: Boot the emulator and record the drive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash scripts/github_drive.sh "$HOME/nova-drive-build/app/outputs/apk/debug/app-debug.apk"

      - name: Upload the drive video
        uses: actions/upload-artifact@v4
        with:
          name: drive-video
          path: drive.mp4
          if-no-files-found: error

      - name: Push the drive video to ci/drive-video
        run: |
          name="drive_$(date -u +%Y%m%d_%H%M)_${GITHUB_SHA::7}.mp4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp drive.mp4 "/tmp/$name"
          if git fetch origin ci/drive-video 2>/dev/null; then
            git switch -c ci/drive-video FETCH_HEAD
          else
            git switch --orphan ci/drive-video
          fi
          mkdir -p videos
          cp "/tmp/$name" "videos/$name"
          git add "videos/$name"
          git commit -m "Drive video $name (emulator run ${GITHUB_RUN_ID})"
          git push origin ci/drive-video
