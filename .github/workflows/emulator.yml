# One hardware-accelerated Android emulator on a GitHub-hosted Ubuntu runner.
# Cursor Cloud and Claude Cloud do not provide usable nested KVM. ubuntu-latest does.
# The job uploads a screenshot of the booted emulator. It does not install 小诺:
# that APK needs the vendor zip and Amap key, which are not in git.

name: Android emulator

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/github-emulator-9a6b

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
          echo "KVM is writable"

      - name: Boot one emulator and capture the screen
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/emulator:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          image="system-images;android-34;google_apis;x86_64"
          installed=0
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if sdkmanager --install "platform-tools" "emulator" "$image"; then
              installed=1
              break
            fi
            echo "system image install failed (attempt $attempt); clearing the partial download"
            rm -rf "$SDK/system-images/android-34/google_apis/x86_64"
            attempt=$((attempt + 1))
            sleep 5
          done
          test "$installed" = 1
          echo no | avdmanager create avd -n nova -k "$image" --force
          emulator -avd nova -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none -accel on >/tmp/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          boot=""
          i=0
          while [ "$i" -lt 60 ]; do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot" = "1" ]; then
              break
            fi
            i=$((i + 1))
            sleep 5
          done
          if [ "$boot" != "1" ]; then
            echo "Android did not finish booting"
            tail -n 80 /tmp/emulator.log || true
            exit 1
          fi
          echo "Android boot completed"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator.png"
          file "$GITHUB_WORKSPACE/emulator.png"

      - name: Upload the screen
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screen
          path: emulator.png
          if-no-files-found: error
