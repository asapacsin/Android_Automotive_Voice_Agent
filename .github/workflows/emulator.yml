# One hardware-accelerated Android emulator on a GitHub-hosted Ubuntu runner.
# Cursor Cloud and Claude Cloud do not provide usable nested KVM. ubuntu-latest does.
# The job uploads a screenshot of the booted emulator. It does not install 小诺:
# that APK needs the vendor zip and Amap key, which are not in git.

name: Android emulator

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/github-emulator-9a6b

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
          echo "KVM is writable"

      - name: Boot one emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: adb exec-out screencap -p > "$GITHUB_WORKSPACE/emulator.png"

      - name: Upload the screen
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screen
          path: emulator.png
          if-no-files-found: error
