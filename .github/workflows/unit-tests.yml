# Tier A gate: the mandatory check on every pull request and every push to main (owner, 2026-10-16).
# A green result means the specified verification actually passed: each job's exit code is the
# verdict of scripts/ci_verdict.py over the check manifest (config/ci_checks.json, suites
# tier-a-gates and tier-a-build), never "the script finished". A required failure fails the job;
# a required check that cannot run (e.g. a secret is missing) is BLOCKED, never a pass.
# The logic lives in scripts/ci_tier_a.sh, which runs the same way locally.
#
# What Tier A proves: the debug APK builds, the JVM unit/architecture/secret-scan suites pass
# (counts from the JUnit XML per module, not the Gradle summary), and the harness gates hold
# (delegation and review records, review-hook selftest, test matrix validation, CI script tests).
# What it does not prove: anything on a device or emulator, audio, the map, lifecycle, or the voice
# model. It opens no voice-model session and calls no paid API.

name: Tier A gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Tier A gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The PR head, not the synthetic merge commit (whose first parent is the base branch and
      # would make the delegation audit walk the wrong history).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upstream ref for the delegation audit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF"
            echo "CI_UPSTREAM_REF=origin/$BASE_REF" >> "$GITHUB_ENV"
          else
            git fetch origin main
            echo "CI_UPSTREAM_REF=origin/main" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Tier A gates
        run: bash scripts/ci_tier_a.sh gates

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-a-gates
          path: evidence/ci
          if-no-files-found: warn

  build-and-test:
    name: Tier A build and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # scripts/cloud_setup.sh installs fixed SDK package versions (platform 34, build-tools 34.0.0,
      # NDK 27.0.12077973, CMake 3.22.1) into /opt/android-sdk and skips packages already present,
      # so a cache keyed on that script is safe. The directory is created and owned by $USER
      # before the restore, as github_build_apk.sh would do, so the restore can write into it.
      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /opt/android-sdk
          sudo chown -R "$USER" /opt/android-sdk

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: /opt/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('scripts/cloud_setup.sh') }}

      - name: Tier A build and JVM tests
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
        run: bash scripts/ci_tier_a.sh build-test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-a-build
          path: |
            evidence/ci/*.jsonl
            evidence/ci/*.json
          if-no-files-found: warn
