# Opt-in live JVM rows, run on demand (scripts/github_live_jvm.sh):
#   text-live  FUZZY-TEXT-LIVE-001 and MUSIC-TEXT-LIVE-001 (Gemini free tier, one run)
#   amap-live  DEMO-AMAP-LIVE-001 (free Amap Web API calls)
#   tryout     DEMO-TRYOUT-001 (Piper u_* clips, Gemini Live WebSocket, real Amap prefetch, ~8 min)
#   style      DEMO-STYLE-001 (P55: Piper s_* clips, Gemini Live; delivery after the sweet request and back, ~5 min)
# Summaries (ids, counts, correct-flags; no phrases, model text, coordinates or addresses) go to
# branch ci/live-jvm-evidence under runs/run_<date>_<sha>_r<run_id>/<piece>/summary.txt. Not for PRs.
# Required secrets: GEMINI_API_KEY (text-live, tryout, style), AMAP_WEB_KEY (amap-live,
# tryout), NOVA_VENDOR_ZIP_URL,
# NOVA_VENDOR_ZIP_AUTH (optional), NOVA_DEBUG_KEYSTORE_B64, AMAP_API_KEY.
# Optional dispatch input gemini_model: the Live model for style (NOVA_GEMINI_MODEL; blank = app default).

name: Live JVM checks

on:
  workflow_dispatch:
    inputs:
      pieces:
        description: "all, text-live, amap-live, tryout or style"
        default: all
      gemini_model:
        description: "optional Live model for style (blank = app default)"
        required: false
        default: ""
  push:
    branches:
      - claude/10-19
      - claude/10-20

permissions:
  contents: write

jobs:
  live:
    # A push runs it only when the commit message asks: [live-jvm].
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[live-jvm]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        piece: [text-live, amap-live, tryout, style]
    concurrency:
      group: live-jvm-evidence-${{ matrix.piece }}-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.pieces == 'all' || inputs.pieces == '' || inputs.pieces == matrix.piece }}
        uses: actions/checkout@v4

      - name: Run text-live and push its summary to ci/live-jvm-evidence
        if: ${{ matrix.piece == 'text-live' && (github.event_name != 'workflow_dispatch' || inputs.pieces == 'all' || inputs.pieces == '' || inputs.pieces == matrix.piece) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEXT_LIVE_MODEL: ${{ vars.TEXT_LIVE_MODEL }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: bash scripts/github_live_jvm.sh text-live

      - name: Run amap-live and push its summary to ci/live-jvm-evidence
        if: ${{ matrix.piece == 'amap-live' && (github.event_name != 'workflow_dispatch' || inputs.pieces == 'all' || inputs.pieces == '' || inputs.pieces == matrix.piece) }}
        env:
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: bash scripts/github_live_jvm.sh amap-live

      - name: Run tryout and push its summary to ci/live-jvm-evidence
        if: ${{ matrix.piece == 'tryout' && (github.event_name != 'workflow_dispatch' || inputs.pieces == 'all' || inputs.pieces == '' || inputs.pieces == matrix.piece) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: bash scripts/github_live_jvm.sh tryout

      - name: Run style and push its summary to ci/live-jvm-evidence
        if: ${{ matrix.piece == 'style' && (github.event_name != 'workflow_dispatch' || inputs.pieces == 'all' || inputs.pieces == '' || inputs.pieces == matrix.piece) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
          NOVA_GEMINI_MODEL: ${{ inputs.gemini_model }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: bash scripts/github_live_jvm.sh style
