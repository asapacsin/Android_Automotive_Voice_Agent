# The navigation demo / its pieces on the real app with the debug-only Gemini override
# (scripts/github_nav_demo.sh). Proves: route, navigation start, quota guard, no crash, the audio
# bridge, judged by the Verdict step (suite "navpiece"); the video is optional evidence. It spends
# the Gemini free tier and is not deterministic, so it runs only by hand or on a tagged commit.
# Emulator evidence is never evidence of real cabin acoustics, echo cancellation, voice
# naturalness or hardware behaviour.
# ubuntu-latest has working KVM. The app is built only when the Actions secrets are set.
# Required secrets: AMAP_API_KEY, NOVA_VENDOR_ZIP_URL, NOVA_DEBUG_KEYSTORE_B64.
# The debug APK is checked against the Amap key's 调试版安全码 SHA1.
# Results come back as annotations (stage reached, Amap error token, route error code), because
# job logs are not readable from the agent sessions. The video is pushed to branch ci/drive-video.
# From cursor/github-emulator-9a6b (Cursor, 2026-10-15), moved onto claude/10-15.
# The job must not print coordinates, addresses, or transcripts.

name: Nav demo

on:
  workflow_dispatch:
    inputs:
      piece:
        description: 'Piece name (demo = main functions plus ambiguous commands, window, gas, lines); empty = full drive'
        required: false
        default: ''
  push:
    branches:
      - claude/10-15
      - claude/10-19
      - claude/10-20
      - claude/10-21
      - demo2.0

permissions:
  contents: write

jobs:
  drive:
    # A push runs it only when the commit message asks: [navdemo].
    # [navpiece]: the short piece check (owner rule 2026-10-16), the first ~150 s of the same drive.
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[navdemo]') || contains(github.event.head_commit.message, '[navpiece') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          # Dependency downloads only (as unit-tests.yml). Never ~/.gradle/caches as a whole: the
          # build cache can hold secret-derived outputs.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Require the app secrets
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
        # A missing secret is BLOCKED, not FAIL: every required id of the suite is recorded BLOCKED
        # (a wildcard through its <prefix>runner), the step exits 0, the later steps are skipped and
        # the Verdict step reports BLOCKED (exit 3).
        id: secrets
        run: |
          missing=""
          for name in AMAP_API_KEY NOVA_VENDOR_ZIP_URL NOVA_DEBUG_KEYSTORE_B64; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "missing $name"
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then echo "ok=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >>"$GITHUB_OUTPUT"
          first="${missing# }"; first="${first%% *}"
          python3 - "navpiece" "secret $first not set" <<'PY'
          import json, subprocess, sys
          suite, detail = sys.argv[1], sys.argv[2]
          required = json.load(open("config/ci_checks.json"))["suites"][suite]["required"]
          ids = []
          for rid in required:
              if rid.endswith("*"):
                  rid = rid[:rid.rfind(":") + 1] + "runner"
              if rid not in ids:
                  ids.append(rid)
          for rid in ids:
              subprocess.run([sys.executable, "scripts/ci_verdict.py", "record", "--out",
                              "evidence/results.jsonl", "--id", rid, "--status", "BLOCKED",
                              "--detail", detail], check=True)
          PY

      # The finished APK is cached by a hash of everything that goes into it, so a repeat demo run
      # skips the 7-minute build. The key also carries 12 hex characters of a hash of the Amap key and
      # the vendor-zip URL (one-way, never printed), so rotating either rebuilds. The cache holds
      # only the debug-signed APK: the Amap key inside it is in the APK manifest of any build anyway.
      - name: APK cache key
        if: steps.secrets.outputs.ok == 'true'
        id: apkkey
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
        run: |
          h="$(printf '%s|%s' "$AMAP_API_KEY" "$NOVA_VENDOR_ZIP_URL" | sha256sum | cut -c1-12)"
          echo "secret_hash=$h" >>"$GITHUB_OUTPUT"

      - name: Cache the built debug APK
        if: steps.secrets.outputs.ok == 'true'
        id: apkcache
        uses: actions/cache@v4
        with:
          path: ~/nova-drive-build/app/outputs/apk/debug
          key: apk-${{ runner.os }}-${{ hashFiles('**/*.kt', '**/*.java', '**/*.xml', '**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'scripts/github_build_apk.sh') }}-${{ steps.apkkey.outputs.secret_hash }}

      - name: Build the debug APK
        if: steps.secrets.outputs.ok == 'true' && steps.apkcache.outputs.cache-hit != 'true'
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          # Dead vendor zip: build on the iFlytek stand-in; build:vendor-real is then BLOCKED, so the
          # run is never green (decided by the decider 2026-10-19; docs/CI.md, tools/vendor-stub).
          NOVA_VENDOR_STUB_OK: "yes"
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
        run: bash scripts/github_build_apk.sh

      - name: Generate the scenario driver clips (edge-tts, synthetic speech)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          python3 -m pip install -q edge-tts truststore imageio-ffmpeg
          for s in make_speech make_extra make_context make_noise; do python3 tools/speech-harness/$s.py >/dev/null; done
          ls tools/speech-harness/speech | wc -l

      - name: Cache the emulator system image
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: sysimg-android-34-google_apis-x86_64-${{ runner.os }}

      - name: Pre-install the emulator system image (retries)
        if: steps.secrets.outputs.ok == 'true'
        run: bash scripts/ci_sysimg.sh

      - name: Boot the emulator and record the navigation demo
        if: steps.secrets.outputs.ok == 'true'
        # Run 38864188722: the script finished but the step hung 40 min shutting the emulator down.
        # The evidence step runs anyway (always()).
        timeout-minutes: ${{ (contains(github.event.head_commit.message, '[navpiece') || (github.event_name == 'workflow_dispatch' && inputs.piece != '')) && 15 || 40 }}
        # The script's verdict is authoritative. Ignore a runner teardown timeout only when the
        # script completed; an interrupted script has no navpiece:complete PASS and Verdict fails.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAV_DEMO_PIECE: ${{ inputs.piece != '' && inputs.piece || (contains(github.event.head_commit.message, '[navpiece:fz14]') && 'fz14' || (contains(github.event.head_commit.message, '[navpiece:demo]') && 'demo' || (contains(github.event.head_commit.message, '[navpiece]') && '1' || ''))) }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # P64 (owner test 10-16, 6.5 fps): all 4 runner cores and 4 GB for the emulator.
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash scripts/github_nav_demo.sh "$HOME/nova-drive-build/app/outputs/apk/debug/app-debug.apk"

      - name: Verdict
        # Fails the job when a required check did not pass (scripts/ci_verdict.py, suite navpiece).
        # A run that crashed before writing results fails here on the missing or empty file.
        if: always()
        run: python3 scripts/ci_verdict.py verdict --manifest config/ci_checks.json --suite navpiece --results evidence/results.jsonl --json-out evidence/verdict.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Push the evidence to ci/nav-demo
        if: always()
        run: |
          test -d evidence || exit 0
          dir="run_$(date -u +%Y%m%d_%H%M)_${GITHUB_SHA::7}"
          [ -f app/libs/Msc.jar.STUB ] && dir="${dir}_stubvendor"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv evidence "/tmp/$dir"
          if git fetch origin ci/nav-demo 2>/dev/null; then
            git switch -c ci/nav-demo FETCH_HEAD
          else
            git switch --orphan ci/nav-demo
          fi
          mkdir -p runs
          mv "/tmp/$dir" "runs/$dir"
          git add "runs/$dir"
          git commit -m "Nav demo $dir (run ${GITHUB_RUN_ID})"
          git push origin ci/nav-demo
