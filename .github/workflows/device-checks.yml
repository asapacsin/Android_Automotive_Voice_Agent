# The autonomous device rows that need the real app but no voice session (scripts/github_device_checks.sh).
# Proves: dispatch rows, a simulated drive to arrival, process death, a revoked microphone, the
# transcript bubble and the nav pieces P61/P63, judged by the Verdict step (suite "device").
# Opens no voice model session (the mic-revoked voice start fails before a session; P61 uses voice
# stop): it spends no paid or quota API except Amap web search (AMAP_WEB_KEY).
# Emulator evidence is never evidence of real cabin acoustics, echo cancellation, voice
# naturalness or hardware behaviour.
# ubuntu-latest has working KVM. The app is built only when the Actions secrets are set.
# Required secrets: AMAP_API_KEY, NOVA_VENDOR_ZIP_URL, NOVA_DEBUG_KEYSTORE_B64.
# The debug APK is checked against the Amap key's 调试版安全码 SHA1.
# Results come back as annotations (stage reached, Amap error token, route error code), because
# job logs are not readable from the agent sessions. The video is pushed to branch ci/drive-video.
# From cursor/github-emulator-9a6b (Cursor, 2026-10-15), moved onto claude/10-15.
# The job must not print coordinates, addresses, or transcripts.

name: Device checks

on:
  workflow_dispatch:
  push:
    branches:
      - claude/10-15
  pull_request:
    paths:
      - "app/src/main/**"
      - "app/src/debug/**"
      - "app/build.gradle*"
      - "scripts/github_device_checks.sh"
      - "scripts/github_build_apk.sh"
      - ".github/workflows/device-checks.yml"
      - "config/ci_checks.json"

# Only pull requests share a group (a new push cancels the older PR run); other runs never cancel.
concurrency:
  group: device-checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  drive:
    # A push runs it only when the commit message asks: [checks]; pull requests and manual runs always.
    # Fork pull requests are skipped: no secrets and a read-only token there.
    if: ${{ (github.event_name != 'push' || contains(github.event.head_commit.message, '[checks]')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Require the app secrets
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
        # A missing secret is BLOCKED, not FAIL: every required id of the suite is recorded BLOCKED
        # (a wildcard through its <prefix>runner), the step exits 0, the later steps are skipped and
        # the Verdict step reports BLOCKED (exit 3).
        id: secrets
        run: |
          missing=""
          for name in AMAP_API_KEY NOVA_VENDOR_ZIP_URL NOVA_DEBUG_KEYSTORE_B64; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "missing $name"
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then echo "ok=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >>"$GITHUB_OUTPUT"
          first="${missing# }"; first="${first%% *}"
          python3 - "device" "secret $first not set" <<'PY'
          import json, subprocess, sys
          suite, detail = sys.argv[1], sys.argv[2]
          required = json.load(open("config/ci_checks.json"))["suites"][suite]["required"]
          ids = []
          for rid in required:
              if rid.endswith("*"):
                  rid = rid[:rid.rfind(":") + 1] + "runner"
              if rid not in ids:
                  ids.append(rid)
          for rid in ids:
              subprocess.run([sys.executable, "scripts/ci_verdict.py", "record", "--out",
                              "evidence/results.jsonl", "--id", rid, "--status", "BLOCKED",
                              "--detail", detail], check=True)
          PY

      - name: Build the debug APK
        if: steps.secrets.outputs.ok == 'true'
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          NOVA_VENDOR_ZIP_URL: ${{ secrets.NOVA_VENDOR_ZIP_URL }}
          NOVA_VENDOR_ZIP_AUTH: ${{ secrets.NOVA_VENDOR_ZIP_AUTH }}
          NOVA_DEBUG_KEYSTORE_B64: ${{ secrets.NOVA_DEBUG_KEYSTORE_B64 }}
        run: bash scripts/github_build_apk.sh

      - name: Boot the emulator and run the device checks
        if: steps.secrets.outputs.ok == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: bash scripts/github_device_checks.sh "$HOME/nova-drive-build/app/outputs/apk/debug/app-debug.apk"

      - name: Verdict
        # Fails the job when a required check did not pass (scripts/ci_verdict.py, suite device).
        # A run that crashed before writing results fails here on the missing or empty file.
        if: always()
        run: python3 scripts/ci_verdict.py verdict --manifest config/ci_checks.json --suite device --results evidence/results.jsonl --json-out evidence/verdict.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Push the evidence to ci/device-evidence
        if: always()
        run: |
          test -d evidence || exit 0
          dir="run_$(date -u +%Y%m%d_%H%M)_${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv evidence "/tmp/$dir"
          if git fetch origin ci/device-evidence 2>/dev/null; then
            git switch -c ci/device-evidence FETCH_HEAD
          else
            git switch --orphan ci/device-evidence
          fi
          mkdir -p runs
          mv "/tmp/$dir" "runs/$dir"
          git add "runs/$dir"
          git commit -m "Device checks $dir (run ${GITHUB_RUN_ID})"
          git push origin ci/device-evidence
