  - "GuidanceSparingCancelTest: guidance active -> no cancel; not active -> one cancel; plus a test that the controller's two call paths reach it if that can be shown without Android (otherwise say so in the report)"
  - "ListeningLifecycleTest: replace the @Disabled GAP shutUpSleepAndWakeWordInActiveSpareOpenGuidance with a pointer comment to GuidanceSparingCancelTest, or keep it @Disabled with the remaining reason if the wiring cannot be shown"
