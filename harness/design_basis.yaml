# Design-basis registry — enforced by scripts/design_basis.py
#
# Migration: only entries listed here are gated. Historical capabilities, TEST_MATRIX rows,
# and existing PASS evidence are NOT backfilled. Absence of a record is not a violation.
#
# Add an entry when a non-trivial task needs a design basis before implementation may proceed.
# Classify triggers with: python scripts/design_basis.py --eval '<json>'
# Check clearance with:   python scripts/design_basis.py --check <id>
#
# status: NOT_REQUIRED | PASS | NEEDS_RESEARCH | NOVEL_REVIEW
# selected_basis: repo | platform_sdk | vendor | industry | adaptation | custom

schema: 1
entries:
  - id: DB-ASTRA-AUDIO-001
    problem_class: full-duplex audio lifecycle and AEC integration
    triggers:
      concurrency: true
      async_lifecycle: true
      audio_media: true
      hardware: true
      prior_failure: true
      declared_uncertain: true
    status: PASS
    selected_basis: adaptation
    selected_pattern: >-
      Preserve the existing PCM ports and WebRTC AEC3; serialize device writes, flush and teardown
      under explicit session/output identity, then migrate cadence and duration accounting by samples.
    evidence: >-
      docs/ASTRA_ARCHITECTURE_SELECTION.md Decisions 1-4 cites official WebRTC AudioProcessing,
      AudioTrack lifecycle, and AOSP desired-versus-actual reconciliation patterns; docs/ASTRA_IMPLEMENTATION_PLAN.md
      adds source-boundary review and Astra High contract review. This clears architecture selection,
      not numerical tuning or acoustic verification.
    suppresses_required_behavior: false
  - id: DB-MAIA-UX-001
    problem_class: product session voice is Qwen Maia only
    triggers:
      audio_media: true
      persistence: true
    status: PASS
    selected_basis: repo
    selected_pattern: >-
      VoiceProviderChoice.resolve always returns Qwen and QwenOmniDialect sends Maia
    evidence: >-
      Owner instruction 2026-10-09: the product session voice is Maia. SPEC-021 seam
      VoiceProviderChoice plus QwenOmniDialect session.update. Q-1 through Q-5 stay open.
    suppresses_required_behavior: false
  - id: DB-WAIT-CUE-001
    problem_class: when Maia speaks a wait cue
    triggers:
      audio_media: true
      async_lifecycle: true
    status: PASS
    selected_basis: repo
    selected_pattern: >-
      WaitCueTurn decides the cue. WaitCueAudio plays it outside the claim gate and outside the
      session state machine. The on-screen working mark is a label only.
    evidence: >-
      Owner timing 2026-10-09: silent for 0-7s except a visual from 3s, one progress line at 7-8s
      only if nothing useful has been spoken, a different delay line at 12s. SPEC-020 WaitCueAudio.
    suppresses_required_behavior: false
  - id: DB-P57-001
    problem_class: a driver-side window request must not move every window
    triggers:
      prior_failure: true
    status: PASS
    selected_basis: repo
    selected_pattern: >-
      ToolCallGuards.driverSideWindow rewrites a control_window target to driver when this turn
      names only the driver side. AndroidToolDispatcher applies that before the body server.
      The epoch rule matches sunroofOnWindowTool. The tool description is a hint only.
    evidence: >-
      P56 showed a tool description does not stop the model choosing window=all. P57 tryout run 4
      sent window=all for 把我这边的窗户开一点. Refusing would leave the driver window shut and fail
      DEMO-TRYOUT u_window, which is a supported request.
    suppresses_required_behavior: false
